<!DOCTYPE html>
<html lang="en">
<head>

<title>WICKWARD — the last flame is your health and your money</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<div id="wrap">

  <div id="errors"></div>

</div>
<script type="module" src="./src/main.js"></script>

</html>
